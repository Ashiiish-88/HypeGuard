# configs/models/fusion.yaml
# Full fusion model training config (T3.5)
# Run: python -m ml.train --config configs/models/fusion.yaml

model_type:   fusion
encoder_type: gru          # gru | tcn | transformer (ablate via separate configs)

# Architecture
price_window:    30        # T = 30 trading days
price_features:  12        # F features per day
gru_hidden:      64
gru_layers:      2
gru_dropout:     0.2
text_proj_dim:   64
fusion_heads:    4
modality_dropout: 0.2      # zero text for 20% of training samples
focal_gamma:     2.0
use_ae_aux:      true      # enable M0 LSTM-AE auxiliary loss
ae_weight:       0.1       # weight of AE loss in total loss

# Training
lr:                  0.001
weight_decay:        0.01
max_epochs:          100
early_stop_patience: 10
batch_size:          64
seed:                42
mixed_precision:     true   # auto-disabled on CPU
oversample:          false  # use focal loss + class-weight instead

# Evaluation
calibrate_on_val:    true
alert_precision_target: 0.60
hype_precision_target:  0.40
